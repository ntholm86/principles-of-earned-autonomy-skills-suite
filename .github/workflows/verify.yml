name: Verify ACM Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run verify.py
        run: python verify.py

      - name: Set up Node.js for the reproducible pilot
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test pilot fixture and external acceptance evaluator
        run: node --test experiments/accountable-agent-pilot/fixture/cart.test.mjs experiments/accountable-agent-pilot/acceptance.test.mjs experiments/accountable-agent-pilot/run.test.mjs
